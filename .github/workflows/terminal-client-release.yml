name: Terminal Client Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to embed in manually built binaries
        required: true
        default: 0.0.0-dev
        type: string
  push:
    tags:
      - 'dd-terminal-v*'

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve terminal version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#dd-terminal-v}"
          else
            version="$INPUT_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Publish ${{ matrix.rid }}
    needs: metadata
    env:
      TERMINAL_VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-15
          - rid: win-x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish terminal client binaries
        shell: bash
        run: |
          ci/workflows/publish-terminal-client.sh \
            "${{ runner.temp }}/terminal-client" \
            "$TERMINAL_VERSION" \
            "${{ matrix.rid }}"

      - name: Verify terminal client package
        shell: bash
        run: |
          ci/workflows/verify-terminal-client-package.sh \
            "${{ runner.temp }}/terminal-client" \
            "$TERMINAL_VERSION" \
            "${{ matrix.rid }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-terminal-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/terminal-client/*.tar.gz
            ${{ runner.temp }}/terminal-client/*.zip
            ${{ runner.temp }}/terminal-client/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dd-terminal-*
          path: ${{ runner.temp }}/terminal-client
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            "${{ runner.temp }}"/terminal-client/*.tar.gz \
            "${{ runner.temp }}"/terminal-client/*.zip \
            "${{ runner.temp }}"/terminal-client/*.sha256 \
            --title "$REF_NAME" \
            --notes ""
