name: CI

on:
  push:
    branches-ignore:
      - staging

jobs:
  build-fe:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Use Node.js 21.x
      uses: actions/setup-node@v1
      with:
        node-version: 21.x
    - name: Build FE-4
      run: |
        cd code/frontend
        npm install
        npm run ci

  build-be:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore .NET tools
      run: dotnet tool restore
    - name: Check Docker
      run: docker info
    - name: Build BE
      working-directory: code/backend
      run: |
        dotnet build DarkDeeds.sln -c Release
        dotnet test DarkDeeds.sln -c Release --no-build
    - name: Analyze BE
      run: ./ci/workflows/analyse-code-jb.sh code/backend/DarkDeeds.sln

  build-e2e-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.100
    - name: Restore .NET tools
      run: dotnet tool restore
    - name: Build E2E Tests
      run: |
        dotnet build code/tests/DarkDeeds.E2eTests/DarkDeeds.E2eTests.sln
    - name: Analyze E2E Tests
      run: ./ci/workflows/analyse-code-jb.sh code/tests/DarkDeeds.E2eTests/DarkDeeds.E2eTests.sln

  build-load-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.100
    - name: Restore .NET tools
      run: dotnet tool restore
    - name: Build Load Tests
      run: |
        dotnet build code/tests/DarkDeeds.LoadTests/DarkDeeds.LoadTests.sln
    - name: Analyze Load Tests
      run: ./ci/workflows/analyse-code-jb.sh code/tests/DarkDeeds.LoadTests/DarkDeeds.LoadTests.sln
